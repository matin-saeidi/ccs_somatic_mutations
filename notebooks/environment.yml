# Conda environment of the figure notebooks. Versions are those we used.
#   conda env create -f environment.yml
#   conda activate ccs_figures
name: ccs_figures
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11.14
  - numpy=2.4.2
  - pandas=3.0.2
  - scipy=1.17.1
  - statsmodels=0.14.6
  - matplotlib=3.10.8
  - biopython=1.88
  - openpyxl=3.1.5
  - pysam=0.23.3
  - jupyterlab
  - ipykernel
  - pip
  - pip:
      - SigProfilerMatrixGenerator==1.3.6
      - SigProfilerAssignment==1.1.5
