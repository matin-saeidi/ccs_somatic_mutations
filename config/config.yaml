# =============================================================================
# config.yaml — inputs, output folders and parameters of the pipeline
#
# Input paths are ours, as examples: replace each with the path on your system.
# Parameters are those of the paper; Methods sections are given in brackets.
# =============================================================================


# ── Reference genome [Alignment] ─────────────────────────────────────────────
# The reference is the C57BL/6J T2T assembly (C57BL_6J_T2T_v1, GenBank
# GCA_964188535.1) with chromosomes X, Y and MT of GRCm39 added
# (workflow/rules/reference.smk).
reference:
  # T2T assembly FASTA (gunzip after download) and its assembly report:
  #   https://ftp.ncbi.nlm.nih.gov/genomes/all/GCA/964/188/535/GCA_964188535.1_C57BL_6J_T2T_v1/
  #     GCA_964188535.1_C57BL_6J_T2T_v1_genomic.fna.gz
  #     GCA_964188535.1_C57BL_6J_T2T_v1_assembly_report.txt
  t2t_fasta:           /insomnia001/depts/pas_lab/projects/mice_neurons/T2T_ref_genome/GCA_964188535.1_C57BL_6J_T2T_v1_genomic.fna
  t2t_assembly_report: /insomnia001/depts/pas_lab/projects/mice_neurons/T2T_ref_genome/GCA_964188535.1_C57BL_6J_T2T_v1_assembly_report.txt

  # GRCm39 FASTA, Ensembl chromosome names (1..19, X, Y, MT), gunzip after download:
  #   https://ftp.ensembl.org/pub/release-112/fasta/mus_musculus/dna/Mus_musculus.GRCm39.dna.primary_assembly.fa.gz
  grcm39_fasta: /insomnia001/depts/pas_lab/projects/mice_neurons/ref_genome/mm39.fa

  # RepeatMasker annotation of the T2T assembly (UCSC GenArk hub):
  #   https://hgdownload.soe.ucsc.edu/hubs/GCA/964/188/535/GCA_964188535.1/GCA_964188535.1.repeatMasker.out.gz
  repeatmasker: /insomnia001/depts/pas_lab/projects/mice_neurons/T2T_ref_genome/GCA_964188535.1.repeatMasker.out.gz

  # Folder for the reference FASTA (b6_t2t_mm39XYM.fa), its index and its pbmm2 index
  out_dir: /insomnia001/depts/pas_lab/projects/mice_neurons/T2T_ref_genome


# ── PacBio HiFi reads [DNA sequencing and read processing] ───────────────────
# One HiFi BAM per library, from CCS by strand (a forward and a reverse strand
# consensus read per molecule), and the animal the library comes from. Libraries
# of the same animal count as one animal for the shared sites of the masked
# sites and for the variants of the same animal.
