  12wk_male_ctx_1_4kb:
    bam:    /insomnia001/depts/pas_lab/projects/mice_neurons/samples/12wk_male_ctx_1_4kb/1_A01/hifi_reads/m84112_251009_234101_s2.hifi_reads.bam
    animal: 12wk_male_ctx_1
  12wk_male_ctx_2_4kb:
    bam:    /insomnia001/depts/pas_lab/projects/mice_neurons/samples/12wk_male_ctx_2_4kb/1_B01/hifi_reads/m84112_251010_014354_s3.hifi_reads.bam
    animal: 12wk_male_ctx_2
  48wk_male_ctx_1_4kb:
    bam:    /insomnia001/depts/pas_lab/projects/mice_neurons/samples/48wk_male_ctx_1_4kb/1_C01/hifi_reads/m84112_251010_034638_s4.hifi_reads.bam
    animal: 48wk_male_ctx_1
  48wk_male_ctx_2_4kb:
    bam:    /insomnia001/depts/pas_lab/projects/mice_neurons/samples/48wk_male_ctx_2_4kb/1_A01/hifi_reads/m84112_260126_232511_s1.hifi_reads.bam
    animal: 48wk_male_ctx_2
  60wk_male_ctx_2_4kb:
    bam:    /insomnia001/depts/pas_lab/projects/mice_neurons/samples/60wk_male_ctx_2_4kb/1_B01/hifi_reads/m84112_260127_012803_s2.hifi_reads.bam
    animal: 60wk_male_ctx_2
  60wk_male_ctx_2_10kb:
    bam:    /insomnia001/depts/pas_lab/projects/mice_neurons/samples/60wk_male_ctx_2_10kb/1_C01/hifi_reads/m84112_260127_033055_s3.hifi_reads.bam
    animal: 60wk_male_ctx_2
  72wk_male_ctx_1_4kb:
    bam:    /insomnia001/depts/pas_lab/projects/mice_neurons/samples/72wk_male_ctx_1_4kb/1_A01/hifi_reads/m84112_250924_224128_s1.hifi_reads.bam
